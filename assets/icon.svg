<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CZL Science and Engineering Visualizations</title>
  <desc id="desc">An isometric structural frame with an orbit passing behind and in front, and a copper observation point.</desc>
