  <path class="back-orbit" d="M18 90a53 18-30 0 1 92-52" stroke="#7fa1cc" stroke-width="3.5" opacity=".48"/>
  <path d="m64 24 33 19-33 20-33-20Z" fill="#292e34"/>
  <path d="m31 43 33 20v39L31 83Z" fill="#20242a"/>
