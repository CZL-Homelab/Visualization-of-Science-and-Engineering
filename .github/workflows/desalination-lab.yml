name: Desalination Lab checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Desalination Lab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Projects/desalination-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline artifact
        run: python build.py
      - name: Check JavaScript syntax
        run: |
          for script in src/*.js src/modules/*.js; do node --check "$script"; done
      - name: Verify physics invariants
        run: node tests/check-physics.cjs
      - name: Verify lesson and 3D state synchronization
        run: node tests/check-scenes.cjs
      - name: Verify offline packaging
        run: node tests/check-build.cjs
      - name: Verify generated page is committed
        run: git diff --exit-code -- index.html
      - name: Build project directory
        working-directory: .
        run: python scripts/build_site.py
      - name: Resolve local links
        working-directory: .
        run: python scripts/check_site.py
