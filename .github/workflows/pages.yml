name: Publish engineering visualizations
on:
  push:
    branches: [main]
    paths: ['Projects/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify Motor Lab
        working-directory: Projects/motor-lab
        run: |
          python build.py
          node --check src/app.js
          node --check src/director.js
          node tests/check-model.cjs
      - name: Prepare static pages
        run: |
          mkdir -p _site/motor-lab
          cp Projects/motor-lab/index.html _site/motor-lab/index.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./motor-lab/"><a href="./motor-lab/">Motor Lab</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
