name: Publish engineering visualizations
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'scripts/**', 'Projects/**', '.github/workflows/**', 'README.md', 'AGENTS.md', 'CONTRIBUTING.md', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CZL-Homelab/Visualization-of-Science-and-Engineering'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify Motor Lab
        working-directory: Projects/motor-lab
        run: |
          python build.py
          for script in src/*.js; do node --check "$script"; done
          node tests/check-model.cjs
      - name: Build and verify Stock Market Lab
        working-directory: Projects/stock-market-lab
        run: |
          python build.py
          for script in src/*.js src/modules/*.js; do node --check "$script"; done
          node tests/check-finance.cjs
          node tests/check-build.cjs
      - name: Prepare static pages
        run: |
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
